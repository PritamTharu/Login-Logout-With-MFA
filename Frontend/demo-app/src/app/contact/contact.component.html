
<!-- contact.component.html -->
<div class="contact-container">
    <h1>Contact Us</h1>
    <p>If you have any questions, feel free to contact us through the form below:</p>
    
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your Name" required />
      </div>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required />
      </div>
      
      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Your Message" required></textarea>
      </div>
      
      <button type="submit" class="submit-btn">Send Message</button>
    </form>

  </div>

<div style="margin-top: 2rem; margin-left: 49rem;">or</div>


<div style="margin-top: 2rem; margin-left: 43rem;">Email us at : email&#64;gmail.com</div>
