<!-- register.component.html -->
<div class="register-container">
    <h2>Login</h2>
    <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          class="form-control"
          #emailField="ngModel"
          placeholder="Enter your email"
        />
        <div *ngIf="emailField.invalid && emailField.touched" class="error-message">
          <small *ngIf="emailField.errors?.['required']">Email is required.</small>
          <small *ngIf="emailField.errors?.['email']">Please enter a valid email.</small>
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="8"
          class="form-control"
          #passwordField="ngModel"
          placeholder="Enter your password"
        />
        <div *ngIf="passwordField.invalid && passwordField.touched" class="error-message">
          <small *ngIf="passwordField.errors?.['required']">Password is required.</small>
          <small *ngIf="passwordField.errors?.['minlength']">Password must be at least 6 characters.</small>
        </div>
      </div>
  
      <button type="submit" [disabled]="registerForm.invalid" class="btn-register">Login</button>
    </form>

    <p>Don't have an account? <a routerLink="/register">Create one</a></p>
  </div>




  <ng-template #VerifyQRTemplate>
    <h2 mat-dialog-title style="text-align: center; font-size: 24px; margin-bottom: 10px;">Enter MFA Code</h2>
    <mat-dialog-content style="text-align: center; padding: 20px;">
      <input required type="number" [(ngModel)]="mfaCode" #inputField="ngModel" (input)="onInputChange()">
    </mat-dialog-content>
    <mat-dialog-content>
        <div *ngIf="inputField.invalid && inputField.touched" class="error-message">
            <small *ngIf="inputField.errors?.['required']">Token is required.</small>
        </div>
        <div *ngIf="mfaErrorMessage" class="error-message">{{ mfaErrorMessage }}</div>
    </mat-dialog-content>
    <mat-dialog-actions style="display: flex; justify-content: center; padding-bottom: 16px; gap: 15px;">
      <button mat-button mat-dialog-close style="padding: 6px 24px; font-size: 14px;">Cancel</button>
      <button mat-button color="primary" style="padding: 6px 24px; font-size: 14px;" (click)="VerifyMfa()">Verify</button>
    </mat-dialog-actions>
</ng-template>
