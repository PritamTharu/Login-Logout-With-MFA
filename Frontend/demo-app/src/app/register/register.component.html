<!-- register.component.html -->
<div class="register-container">
    <h2>Register</h2>
    <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          class="form-control"
          #emailField="ngModel"
          placeholder="Enter your email"
        />
        <div *ngIf="emailField.invalid && emailField.touched" class="error-message">
          <small *ngIf="emailField.errors?.['required']">Email is required.</small>
          <small *ngIf="emailField.errors?.['email']">Please enter a valid email.</small>
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          class="form-control"
          #passwordField="ngModel"
          placeholder="Enter your password"
        />
        <div *ngIf="passwordField.invalid && passwordField.touched" class="error-message">
          <small *ngIf="passwordField.errors?.['required']">Password is required.</small>
          <small *ngIf="passwordField.errors?.['minlength']">Password must be at least 6 characters.</small>
        </div>
      </div>
  
      <button type="submit" [disabled]="registerForm.invalid" class="btn-register">Register</button>
    </form>
    <p>Already have an account? <a routerLink="/">Login here</a></p>
  </div>
